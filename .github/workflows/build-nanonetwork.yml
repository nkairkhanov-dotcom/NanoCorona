name: Build NanoCorona release

on:
  push:
    branches: [main, phase6-max2026-corona15]
    tags: ["v*"]
    paths:
      - "src/**"
      - "installer/**"
      - "docs/**"
      - "Update-NanoCorona.bat"
      - ".github/workflows/build-nanonetwork.yml"
  pull_request:
    paths:
      - "src/**"
      - "installer/**"
      - "docs/**"
      - "Update-NanoCorona.bat"
      - ".github/workflows/build-nanonetwork.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install installer build tools
        shell: powershell
        run: choco install innosetup imagemagick --no-progress -y

      - name: Resolve installer version
        shell: powershell
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v([0-9]+(?:\.[0-9]+){0,3})$") {
            "NANOCORONA_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "NANOCORONA_VERSION=0.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build distributable packages
        shell: powershell
        run: .\installer\Build-Release.ps1 -Version $env:NANOCORONA_VERSION

      - name: Upload installer packages
        uses: actions/upload-artifact@v4
        with:
          name: NanoCorona-installer
          path: |
            dist/NanoCorona-Setup.exe
            dist/NanoCorona.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NanoCorona-Setup.exe
            dist/NanoCorona.zip
          generate_release_notes: true
