name: Build NanoCorona release

on:
  push:
    branches: [main, phase6-max2026-corona15]
    tags: ["v*"]
    paths:
      - "src/**"
      - "installer/**"
      - "docs/**"
      - "Update-NanoCorona.bat"
      - ".github/workflows/build-nanonetwork.yml"
  pull_request:
    paths:
      - "src/**"
      - "installer/**"
      - "docs/**"
      - "Update-NanoCorona.bat"
      - ".github/workflows/build-nanonetwork.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install installer build tools
        shell: powershell
        run: choco install innosetup imagemagick --no-progress -y

      - name: Resolve installer version
        shell: powershell
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v([0-9]+(?:\.[0-9]+){0,3})$") {
            "NANOCORONA_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "NANOCORONA_VERSION=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "NANOCORONA_VERSION=0.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build distributable packages
        shell: powershell
        run: .\installer\Build-Release.ps1 -Version $env:NANOCORONA_VERSION

      - name: Validate PowerShell installer scripts
        shell: powershell
        run: |
          $scripts = @(
            ".\installer\Build-Release.ps1",
            ".\installer\Install-NanoCorona.ps1",
            ".\installer\Uninstall-NanoCorona.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax validation failed: $script"
            }
          }

      - name: Validate distributable contents
        shell: powershell
        run: |
          $setup = ".\dist\NanoCorona-Setup.exe"
          $zip = ".\dist\NanoCorona.zip"
          if (!(Test-Path $setup) -or (Get-Item $setup).Length -lt 100KB) { throw "Installer EXE is missing or unexpectedly small." }
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 10KB) { throw "Portable ZIP is missing or unexpectedly small." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $required = @(
              "runtime/NanoNetwork.dll",
              "NanoCorona_VFB_Prototype.ms",
              "NanoCorona_RenderExtraction.ms",
              "NanoCorona_Toolbar.ms",
              "Install-NanoCorona.ps1",
              "Uninstall-NanoCorona.ps1",
              "NanoCorona-MANIFEST.txt"
            )
            $names = $archive.Entries.FullName | ForEach-Object { $_ -replace '\\', '/' }
            foreach ($name in $required) { if ($name -notin $names) { throw "ZIP validation failed: missing $name" } }
          } finally { $archive.Dispose() }

      - name: Upload installer packages
        uses: actions/upload-artifact@v4
        with:
          name: NanoCorona-installer
          path: |
            dist/NanoCorona-Setup.exe
            dist/NanoCorona.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NANOCORONA_VERSION }}
          target_commitish: ${{ github.sha }}
          name: NanoCorona v${{ env.NANOCORONA_VERSION }}
          files: |
            dist/NanoCorona-Setup.exe
            dist/NanoCorona.zip
          generate_release_notes: true
