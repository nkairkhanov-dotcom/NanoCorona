name: One-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ 2>/dev/null || true
          branches="$(gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name')"
          while IFS= read -r branch; do
            [ -z "${branch}" ] && continue
            if [ "${branch}" = "main" ]; then
              continue
            fi
            echo "Deleting branch: ${branch}"
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}"
          done <<< "${branches}"
